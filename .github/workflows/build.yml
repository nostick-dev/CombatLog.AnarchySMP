name: CombatLog Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and locate pom.xml
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="CombatLog-source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            echo "Files in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          POM_FILE="$(find extracted -type f -name pom.xml -print -quit)"

          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml was not found inside the ZIP."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM_FILE")"

          echo "Found Maven project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build plugin with Maven
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Collect JAR files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p release-files

          find "$PROJECT_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} release-files/ \;

          if ! find release-files -maxdepth 1 -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: No JAR files were built."
            echo "Target directory contents:"
            find "$PROJECT_DIR/target" -maxdepth 2 -type f || true
            exit 1
          fi

          ls -lh release-files

      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" release-files/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "CombatLog $TAG" \
            --notes "Automated Maven build of CombatLog." \
            --target "$GITHUB_SHA"
            
