
name: CombatLog Build & Release

on:
  workflow_dispatch:
    inputs:
      refresh_source:
        description: "Unzip CombatLog-source.zip again and replace extracted source"
        required: true
        type: boolean
        default: false
      version:
        description: "Release version, e.g. 1.0.1. Leave empty for automatic version"
        required: false
        type: string
        default: ""

  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: combatlog-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source only when needed
        id: project
        shell: bash
        env:
          REFRESH_SOURCE: ${{ inputs.refresh_source || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ZIP_FILE="CombatLog-source.zip"
          SOURCE_DIR="CombatLog-source"

          POM_FILE="$(find "$SOURCE_DIR" -type f -name pom.xml -print -quit 2>/dev/null || true)"

          if [[ "$REFRESH_SOURCE" == "true" || -z "$POM_FILE" ]]; then
            if [[ ! -f "$ZIP_FILE" ]]; then
              echo "ERROR: ZIP file not found: $ZIP_FILE"
              exit 1
            fi

            echo "Extracting $ZIP_FILE ..."
            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"
            unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

            POM_FILE="$(find "$SOURCE_DIR" -type f -name pom.xml -print -quit)"

            if [[ -z "$POM_FILE" ]]; then
              echo "ERROR: pom.xml was not found inside the ZIP."
              exit 1
            fi

            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git add "$SOURCE_DIR"

              if ! git diff --cached --quiet; then
                git commit -m "chore: extract CombatLog source"
                git push origin "HEAD:$REF_NAME"
              fi
            else
              echo "ERROR: Source missing on tag build."
              echo "Run the workflow manually on the branch first."
              exit 1
            fi
          else
            echo "Using existing extracted source."
            echo "ZIP extraction skipped."
          fi

          POM_FILE="$(find "$SOURCE_DIR" -type f -name pom.xml -print -quit)"
          PROJECT_DIR="$(dirname "$POM_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin with Maven
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Collect JAR files
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p release-files

          find "$PROJECT_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} release-files/ \;

          if ! find release-files -maxdepth 1 -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: No JAR files were built."
            exit 1
          fi

          ls -lh release-files

      - name: Set unique release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: Release/tag $TAG already exists. Use a new version."
            exit 1
          fi

          gh release create "$TAG" release-files/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "CombatLog $TAG" \
            --notes "Automated Maven build of CombatLog."
            
